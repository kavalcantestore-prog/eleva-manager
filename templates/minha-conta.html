{% extends "base.html" %}
{% block title %}Minha Conta — ELEVA{% endblock %}
{% block content %}

<div class="page-header">
  <h2><i class="fa fa-user-circle"></i> Minha Conta</h2>
</div>

<div style="max-width: 600px;">
  <div class="card">
    <h3>Informações Pessoais</h3>
    <div class="form-group">
      <label>Nome</label>
      <input type="text" value="{{ user.name }}" disabled style="background: var(--bg3);"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" value="{{ user.email }}" disabled style="background: var(--bg3);"/>
    </div>
  </div>

  <div class="card" style="margin-top: 2rem;">
    <h3><i class="fa fa-lock"></i> Trocar Senha</h3>
    <form onsubmit="trocarSenha(event)">
      <div class="form-group">
        <label>Senha Atual *</label>
        <input type="password" id="senha-atual" placeholder="Sua senha atual" required/>
      </div>
      <div class="form-group">
        <label>Nova Senha *</label>
        <input type="password" id="nova-senha" placeholder="Min 8 caracteres" required/>
      </div>
      <div class="form-group">
        <label>Confirmar Nova Senha *</label>
        <input type="password" id="confirmar-senha" placeholder="Confirme a nova senha" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Trocar Senha</button>
    </form>
  </div>
</div>

<style>
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--gold); }
.form-group input { width: 100%; padding: 0.75rem; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-size: 1rem; }
.form-group input:focus { outline: none; border-color: var(--gold); }
.btn { padding: 0.75rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
.btn-primary { background: var(--gold); color: var(--bg); }
.btn-primary:hover { background: #d4a944; }
</style>

<script>
function trocarSenha(event) {
  event.preventDefault();
  const senhaAtual = document.getElementById('senha-atual').value;
  const novaSenha = document.getElementById('nova-senha').value;
  const confirmarSenha = document.getElementById('confirmar-senha').value;

  if (novaSenha.length < 8) {
    alert('Senha deve ter pelo menos 8 caracteres');
    return;
  }

  if (novaSenha !== confirmarSenha) {
    alert('As senhas não conferem');
    return;
  }

  fetch('/minha-conta/trocar-senha', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      senha_atual: senhaAtual,
      senha_nova: novaSenha
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      alert('Senha alterada com sucesso!');
      document.getElementById('senha-atual').value = '';
      document.getElementById('nova-senha').value = '';
      document.getElementById('confirmar-senha').value = '';
    } else {
      alert('Erro: ' + d.error);
    }
  })
  .catch(e => alert('Erro ao trocar senha'));
}
</script>
{% endblock %}
